<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img" aria-label="Ilustrasi gedung sekolah SDN 2 Klambu">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8F4EC"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF1ED"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E7D57"/>
      <stop offset="1" stop-color="#1B5E43"/>
    </linearGradient>
  </defs>
  <rect width="520" height="340" fill="url(#sky)" rx="18"/>

  <!-- awan -->
  <g fill="#FFFFFF" opacity=".9">
    <ellipse cx="90" cy="70" rx="34" ry="13"/>
    <ellipse cx="115" cy="60" rx="24" ry="11"/>
    <ellipse cx="440" cy="55" rx="40" ry="14"/>
  </g>

  <!-- matahari -->
  <circle cx="465" cy="45" r="22" fill="#F2B33D"/>
  <g stroke="#F2B33D" stroke-width="3" stroke-linecap="round" opacity=".6">
    <line x1="465" y1="14" x2="465" y2="24"/><line x1="465" y1="66" x2="465" y2="76"/>
    <line x1="435" y1="45" x2="445" y2="45"/><line x1="485" y1="45" x2="495" y2="45"/>
    <line x1="445" y1="25" x2="452" y2="32"/><line x1="478" y1="58" x2="485" y2="65"/>
  </g>

  <!-- tiang bendera -->
  <g>
    <rect x="452" y="120" width="4" height="120" fill="#9AA6A0"/>
    <path d="M452 122 L492 132 L452 152 Z" fill="#E23B3B"/>
    <path d="M452 134 L492 144 L452 156 Z" fill="#E23B3B"/>
  </g>

  <!-- gedung utama -->
  <rect x="60" y="90" width="300" height="140" fill="url(#wall)" stroke="#D5DED9" stroke-width="2"/>
  <path d="M40 90 L210 30 L380 90 Z" fill="#2E7D57"/>
  <path d="M40 90 L210 30 L380 90 Z" fill="url(#roof)" opacity=".25"/>
  <rect x="52" y="88" width="320" height="10" fill="#1B5E43" rx="4"/>
  <!-- tiang depan -->
  <g fill="#EDF3F0" stroke="#D5DED9">
    <rect x="75" y="130" width="14" height="90"/>
    <rect x="263" y="130" width="14" height="90"/>
  </g>
  <!-- pintu -->
  <rect x="222" y="140" width="36" height="90" fill="#1B5E43"/>
  <circle cx="232" cy="200" r="2.6" fill="#F2B33D"/>
  <!-- jendela -->
  <g fill="#BFE3EF" stroke="#1B5E43" stroke-width="2.4">
    <rect x="76" y="115" width="0" height="0"/>
    <rect x="82" y="126" width="30" height="26" rx="3"/>
    <rect x="120" y="126" width="30" height="26" rx="3"/>
    <rect x="158" y="126" width="30" height="26" rx="3"/>
    <rect x="252" y="126" width="20" height="26" rx="3"/>
    <rect x="82" y="164" width="30" height="26" rx="3"/>
    <rect x="120" y="132" width="0" height="0"/>
    <rect x="120" y="164" width="30" height="26" rx="3"/>
    <rect x="158" y="164" width="30" height="26" rx="3"/>
    <rect x="252" y="164" width="20" height="26" rx="3"/>
  </g>
  <!-- tangga -->
  <rect x="210" y="230" width="60" height="6" fill="#C9D4CF"/>
  <rect x="204" y="236" width="72" height="8" fill="#D8E0DB"/>

  <!-- pohon -->
  <g>
    <rect x="118" y="256" width="9" height="34" fill="#8A6A4B"/>
    <circle cx="118" cy="248" r="26" fill="#4CAF7D"/>
    <circle cx="100" cy="262" r="18" fill="#3E9E6C"/>
    <circle cx="136" cy="262" r="18" fill="#57BB85"/>
  </g>
  <g>
    <rect x="440" y="196" width="8" height="28" fill="#8A6A4B"/>
    <circle cx="440" cy="188" r="22" fill="#4CAF7D"/>
    <circle cx="424" cy="198" r="14" fill="#57BB85"/>
  </g>

  <!-- tembok penanda nama -->
  <rect x="150" y="286" width="100" height="30" rx="6" fill="#FFFFFF" stroke="#D5DED9"/>
  <rect x="160" y="296" width="80" height="6" rx="3" fill="#2E7D57"/>
  <rect x="166" y="304" width="40" height="5" rx="2.5" fill="#C9D4CF"/>

  <!-- tanah -->
  <rect x="0" y="312" width="520" height="28" fill="#DFF0E5"/>
  <g fill="#B9D9C8">
    <rect x="120" y="304" width="26" height="8" rx="4"/>
    <rect x="300" y="300" width="26" height="8" rx="4"/>
    <rect x="470" y="304" width="26" height="8" rx="4"/>
  </g>
</svg>
